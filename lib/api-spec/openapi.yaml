openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: order-inquiries
    description: Order inquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /order-inquiries:
    post:
      operationId: createOrderInquiry
      tags: [order-inquiries]
      summary: Email an order inquiry to the store
      description: Sends a customer-submitted pack request to the configured store inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInquiryInput"
      responses:
        "202":
          description: Inquiry emailed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderInquiryAccepted"
        "400":
          description: The inquiry was invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many recent inquiries from this visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The inquiry could not be emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderInquiryInput:
      type: object
      properties:
        bottleCount:
          type: integer
          minimum: 1
          maximum: 50
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        message:
          type: string
          maxLength: 500
        consent:
          type: boolean
      required: [bottleCount, name, email, consent]
    OrderInquiryAccepted:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required: [ok, message]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

